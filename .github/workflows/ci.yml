name: Airline Tests
on: push

jobs:
    test_project:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4


            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            - name: Install Django
              run: pip install django

            - name: Run Django Tests
              run: python manage.py test